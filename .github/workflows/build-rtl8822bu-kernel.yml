name: Build Apollo RTL8822BU kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: staging
          path: kernel

      - name: Install build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y \
            bc bison flex libssl-dev libelf-dev \
            build-essential python3 python-is-python3 cpio rsync \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi zip unzip

      - name: Restore clang-r530567 cache
        id: clang-cache
        uses: actions/cache/restore@v4
        with:
          path: toolchain/clang
          key: clang-r530567-linux-x86

      - name: Fetch clang-r530567
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain
          git clone --depth=1 -b llvm-r530567 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            toolchain/clang

      - name: Save clang-r530567 cache
        if: steps.clang-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: toolchain/clang
          key: clang-r530567-linux-x86

      - name: Patch kbuild and enable RTL8822B
        working-directory: kernel
        run: |
          sed -i 's|src[[:space:]]*:=[[:space:]]*$(srctree)PHONY += $(O)/include/config/auto.conf|src := $(srctree)|' Makefile
          sed -i 's|include kali-nethunter-kernel/out/include/config/auto.conf|include include/config/auto.conf|' Makefile
          sed -i '/CONFIG_RTL8814A = y/a CONFIG_RTL8822B = y' drivers/net/wireless/realtek/rtl8812au/Makefile
          sed -i 's|obj-$(CONFIG_88XXAU)[[:space:]]*+= rtl8812au/|obj-y += rtl8812au/|' drivers/net/wireless/realtek/Makefile
          sed -i '/0x2357, 0x0115/s/\.driver_info = RTL8812/\.driver_info = RTL8822B/' drivers/net/wireless/realtek/rtl8812au/os_dep/linux/usb_intf.c
          sed -i '/^static ssize_t cpuset_write_resmask_assist/i #ifdef CONFIG_CPUSET_ASSIST' kernel/cgroup/cpuset.c
          sed -i '/^static ssize_t cpuset_write_resmask_wrapper/i #endif' kernel/cgroup/cpuset.c
          sed -i 's/task_rq(p)->cpu_load\[0\]/task_rq(p)->cfs.avg.load_avg/' include/trace/events/sched.h
          sed -i 's/\.runnable_load_avg/\.runnable_avg/g' include/trace/events/sched.h
          sed -i 's/idle_get_state_idx(cpu_rq(cpu))/(idle_get_state(cpu_rq(cpu)) ? 1 : 0)/' include/trace/events/sched.h
          sed -i 's/cpu_isolated(cpu)/0/' include/trace/events/sched.h
          grep -n -E 'CONFIG_RTL8822B|0x2357, 0x0115|obj-y.*rtl8812au' \
            drivers/net/wireless/realtek/rtl8812au/Makefile \
            drivers/net/wireless/realtek/rtl8812au/os_dep/linux/usb_intf.c \
            drivers/net/wireless/realtek/Makefile

      - name: Prepare source-supported Apollo config
        working-directory: kernel
        run: |
          export PATH="${{ github.workspace }}/toolchain/clang/clang-r530567/bin:$PATH"
          cp arch/arm64/configs/nethunter_defconfig_apollo .config
          chmod +x scripts/config
          ./scripts/config --set-val LITTLE_CPU_MASK 15
          ./scripts/config --set-val BIG_CPU_MASK 112
          ./scripts/config --set-val PRIME_CPU_MASK 128
          ./scripts/config --enable USB
          ./scripts/config --enable WLAN
          ./scripts/config --enable CFG80211
          ./scripts/config --disable SECURITY_SMACK
          ./scripts/config --disable SCHED_WALT
          ./scripts/config --enable PELT_COMPATIBILITY_LAYER
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- olddefconfig
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- kernelrelease

      - name: Build kernel image with built-in RTL8822BU support
        working-directory: kernel
        run: |
          export PATH="${{ github.workspace }}/toolchain/clang/clang-r530567/bin:$PATH"
          make -j"$(nproc)" ARCH=arm64 CC=clang LD=ld.lld \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- Image.gz

      - name: Package Apollo AnyKernel ZIP
        run: |
          curl -fL \
            https://github.com/dtrail/nethunter_kernel_xiaomi_sm8250/releases/download/1.1.9c/apollo-N0tHunter_Kernel_20260417.zip \
            -o base.zip
          mkdir package
          unzip -q base.zip -d package
          cp kernel/arch/arm64/boot/Image.gz package/Image.gz
          cd package
          zip -qr ../apollo-N0tHunter-RTL8822BU.zip .

      - name: Upload flashable kernel
        uses: actions/upload-artifact@v4
        with:
          name: apollo-N0tHunter-RTL8822BU
          path: apollo-N0tHunter-RTL8822BU.zip
          if-no-files-found: error
